<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helping Hands Circle - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="bootloader" class="bootloader">
        <div class="bootloader-content">
            <div class="spinner"></div>
            <h2>Loading Helping Hands Circle...</h2>
        </div>
    </div>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <img src="assets/images/logo.svg" alt="Helping Hands Circle Logo" class="logo">
                <h1>Helping Hands Circle</h1>
                <p>Stronger Together</p>
            </div>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="e.g., kingsley" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-group">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="off">
                        <button type="button" class="password-toggle" id="passwordToggle" title="Show/Hide Password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Login</button>
                <div id="errorMessage" class="error-message" style="display: none; margin-top: 15px; padding: 10px; background-color: #FEE2E2; border-radius: 6px; border-left: 4px solid #EF4444;"></div>
            </form>
        </div>
    </div>

    <!-- Password Change Modal -->
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Change Password</h2>
                <span class="close">&times;</span>
            </div>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-group">
                        <input type="password" id="newPassword" name="newPassword" required autocomplete="off">
                        <button type="button" class="password-toggle" id="newPasswordToggle" title="Show/Hide Password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-meter">
                        <div class="meter-bar"><div class="meter-fill" id="passwordStrength"></div></div>
                        <div class="meter-text"><span id="strengthText">Very Weak</span></div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-group">
                        <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="off">
                        <button type="button" class="password-toggle" id="confirmPasswordToggle" title="Show/Hide Password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Update Password</button>
            </form>
        </div>
    </div>

    <!-- Success/Error Notification Modal -->
    <div id="notificationModal" class="modal">
        <div class="modal-content modal-notification">
            <div class="notification-icon" id="notificationIcon"></div>
            <h2 id="notificationTitle">Success</h2>
            <p id="notificationMessage">Operation completed successfully</p>
            <button type="button" class="btn-primary" id="notificationBtn">Close</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lib/config.js"></script>
    <script src="lib/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
