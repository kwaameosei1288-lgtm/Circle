<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helping Hands Circle - Contributions</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="bootloader" class="bootloader">
        <div class="bootloader-content">
            <div class="spinner"></div>
            <h2>Loading Contributions...</h2>
        </div>
    </div>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="assets/images/logo.svg" alt="Helping Hands Circle Logo" class="logo">
                <h2>Helping Hands Circle</h2>
                <p>Stronger Together</p>
            </div>
            <nav class="sidebar-menu">
                <ul>
                    <li><a href="#" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                    <li><a href="#" class="active" data-page="contributions"><i class="fas fa-money-bill-wave"></i> Contributions</a></li>
                    <li><a href="#" data-page="welfare"><i class="fas fa-heart"></i> Welfare</a></li>
                    <li><a href="#" data-page="reports"><i class="fas fa-chart-bar"></i> Reports</a></li>
                    <li><a href="#" data-page="members"><i class="fas fa-users"></i> Members</a></li>
                    <li><a href="#" data-page="profile"><i class="fas fa-user"></i> Profile</a></li>
                    <li><a href="#" data-page="settings"><i class="fas fa-cog"></i> Settings</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <header class="header">
                <button class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="header-title">Contributions</h1>
                <div class="header-actions">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">U</div>
                        <span id="userName">User</span>
                    </div>
                    <button class="btn-secondary" onclick="window.utils.logout()">Logout</button>
                </div>
            </header>

            <div class="content">
                <!-- Add Payment Button -->
                <div style="margin-bottom: 20px;">
                    <button class="btn-primary" onclick="openAddPaymentModal()">Add Payment</button>
                </div>

                <!-- Contributions Table -->
                <div class="table-container">
                    <div class="table-header">
                        <h2 class="table-title">All Contributions</h2>
                        <div class="table-actions">
                            <select id="monthFilter" class="form-group" style="margin: 0; width: auto;">
                                <option value="">All Months</option>
                                <option value="January">January</option>
                                <option value="February">February</option>
                                <option value="March">March</option>
                                <option value="April">April</option>
                                <option value="May">May</option>
                                <option value="June">June</option>
                                <option value="July">July</option>
                                <option value="August">August</option>
                                <option value="September">September</option>
                                <option value="October">October</option>
                                <option value="November">November</option>
                                <option value="December">December</option>
                            </select>
                            <select id="statusFilter" class="form-group" style="margin: 0; width: auto;">
                                <option value="">All Status</option>
                                <option value="paid">Paid</option>
                                <option value="pending">Pending</option>
                                <option value="late">Late</option>
                            </select>
                        </div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Member</th>
                                <th>Amount</th>
                                <th>Payment Type</th>
                                <th>Month</th>
                                <th>Transaction ID</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="contributionsTable">
                            <!-- Data will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Payment Modal -->
    <div id="addPaymentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Payment</h2>
                <span class="close" onclick="closeModal('addPaymentModal')">&times;</span>
            </div>
            <form id="addPaymentForm" class="modal-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="memberSelect">Member</label>
                        <select id="memberSelect" required>
                            <option value="">Select Member</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount (GHS)</label>
                        <input type="number" id="amount" step="0.01" value="50" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="paymentType">Payment Type</label>
                        <select id="paymentType" required>
                            <option value="full">Full Payment</option>
                            <option value="part">Part Payment</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="paymentMonth">Month</label>
                        <select id="paymentMonth" required>
                            <option value="January">January</option>
                            <option value="February">February</option>
                            <option value="March">March</option>
                            <option value="April">April</option>
                            <option value="May">May</option>
                            <option value="June">June</option>
                            <option value="July">July</option>
                            <option value="August">August</option>
                            <option value="September">September</option>
                            <option value="October">October</option>
                            <option value="November">November</option>
                            <option value="December">December</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="transactionId">Transaction ID</label>
                    <input type="text" id="transactionId" placeholder="Optional">
                </div>
                <button type="submit" class="btn-primary">Add Payment</button>
            </form>
        </div>
    </div>

    <div class="toast-container"></div>

    <script src="lib/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lib/utils.js" defer></script>
    <script src="js/contributions.js" defer></script>
</body>
</html>
