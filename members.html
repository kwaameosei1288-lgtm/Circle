<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helping Hands Circle - Members</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="bootloader" class="bootloader">
        <div class="bootloader-content">
            <div class="spinner"></div>
            <h2>Loading Members...</h2>
        </div>
    </div>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="assets/images/logo.svg" alt="Helping Hands Circle Logo" class="logo">
                <h2>Helping Hands Circle</h2>
                <p>Stronger Together</p>
            </div>
            <nav class="sidebar-menu">
                <ul>
                    <li><a href="#" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                    <li><a href="#" data-page="contributions"><i class="fas fa-money-bill-wave"></i> Contributions</a></li>
                    <li><a href="#" data-page="welfare"><i class="fas fa-heart"></i> Welfare</a></li>
                    <li><a href="#" data-page="reports"><i class="fas fa-chart-bar"></i> Reports</a></li>
                    <li><a href="#" class="active" data-page="members"><i class="fas fa-users"></i> Members</a></li>
                    <li><a href="#" data-page="profile"><i class="fas fa-user"></i> Profile</a></li>
                    <li><a href="#" data-page="settings"><i class="fas fa-cog"></i> Settings</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <header class="header">
                <button class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="header-title">Members</h1>
                <div class="header-actions">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">U</div>
                        <span id="userName">User</span>
                    </div>
                    <button class="btn-secondary" onclick="window.utils.logout()">Logout</button>
                </div>
            </header>

            <div class="content">
                <!-- Add Member Button -->
                <div style="margin-bottom: 20px;">
                    <button class="btn-primary" onclick="openAddMemberModal()">Add Member</button>
                </div>

                <!-- Members Table -->
                <div class="table-container">
                    <div class="table-header">
                        <h2 class="table-title">All Members</h2>
                        <div class="table-actions">
                            <select id="roleFilter" class="form-group" style="margin: 0; width: auto;">
                                <option value="">All Roles</option>
                                <option value="admin">Admin</option>
                                <option value="treasurer">Treasurer</option>
                                <option value="secretary">Secretary</option>
                                <option value="welfare_officer">Welfare Officer</option>
                                <option value="assistant_welfare_officer">Assistant Welfare Officer</option>
                                <option value="member">Member</option>
                            </select>
                        </div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Role</th>
                                <th>Payment Status</th>
                                <th>Joined</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="membersTable">
                            <!-- Data will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Member Modal -->
    <div id="memberModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Member</h2>
                <span class="close" onclick="closeModal('memberModal')">&times;</span>
            </div>
            <form id="memberForm" class="modal-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="memberName">Name</label>
                        <input type="text" id="memberName" required>
                    </div>
                    <div class="form-group">
                        <label for="memberEmail">Email</label>
                        <input type="email" id="memberEmail" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="memberPhone">Phone</label>
                        <input type="tel" id="memberPhone">
                    </div>
                    <div class="form-group">
                        <label for="memberRole">Role</label>
                        <select id="memberRole" required>
                            <option value="member">Member</option>
                            <option value="admin">Admin</option>
                            <option value="treasurer">Treasurer</option>
                            <option value="secretary">Secretary</option>
                            <option value="welfare_officer">Welfare Officer</option>
                            <option value="assistant_welfare_officer">Assistant Welfare Officer</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Save Member</button>
            </form>
        </div>
    </div>

    <div class="toast-container"></div>

    <script src="lib/config.js"></script>
    <script>
        // Load Supabase library synchronously
        (function() {
            var script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
            script.onload = function() {
                console.log('Supabase library loaded');
            };
            script.onerror = function() {
                console.error('Failed to load Supabase library');
            };
            document.head.appendChild(script);
        })();
    </script>
    <script src="lib/utils.js"></script>
    <script src="js/members.js"></script>
</body>
</html>
